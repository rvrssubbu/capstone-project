server:
  port: 8085
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: merchant-route
          uri: ${MERCHANT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/merchants/**
        - id: payment-route
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/payments/**
        - id: ledger-route
          uri: ${LEDGER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/ledger/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
logging:
  level:
    org:
      springframework:
        cloud:
          gateway: DEBUG
    reactor:
      netty:
        http:
          client: DEBUG