apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: {{ include "paypilot.namespace" . }}
  labels:
    app: api-gateway
{{ include "paypilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.apiGateway.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.port }}
          envFrom:
            - configMapRef:
                name: paypilot-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.apiGateway.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ include "paypilot.namespace" . }}
  labels:
    app: api-gateway
{{ include "paypilot.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.apiGateway.port }}
      targetPort: {{ .Values.apiGateway.port }}
      nodePort: {{ .Values.apiGateway.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paypilot-ui
  namespace: {{ include "paypilot.namespace" . }}
  labels:
    app: paypilot-ui
{{ include "paypilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: paypilot-ui
  template:
    metadata:
      labels:
        app: paypilot-ui
    spec:
      containers:
        - name: paypilot-ui
          image: {{ .Values.ui.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ui.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paypilot-ui
  namespace: {{ include "paypilot.namespace" . }}
  labels:
    app: paypilot-ui
{{ include "paypilot.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: paypilot-ui
  ports:
    - port: {{ .Values.ui.port }}
      targetPort: {{ .Values.ui.port }}
      nodePort: {{ .Values.ui.nodePort }}
