apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-service
  namespace: paypilot
spec:
  replicas: 1
  selector:
    matchLabels: { app: merchant-service }
  template:
    metadata:
      labels: { app: merchant-service }
    spec:
      containers:
        - name: merchant-service
          image: paypilot/merchant-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom: { configMapKeyRef: { name: paypilot-config, key: MERCHANT_DATASOURCE_URL } }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: paypilot-db-secret, key: username } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: paypilot-db-secret, key: password } }
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: merchant-service
  namespace: paypilot
spec:
  type: ClusterIP
  selector: { app: merchant-service }
  ports:
    - port: 8081
      targetPort: 8081
---
