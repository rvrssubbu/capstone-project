apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: paypilot
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: paypilot/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: paypilot-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: paypilot
spec:
  type: NodePort
  selector: { app: api-gateway }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paypilot-ui
  namespace: paypilot
spec:
  replicas: 1
  selector:
    matchLabels: { app: paypilot-ui }
  template:
    metadata:
      labels: { app: paypilot-ui }
    spec:
      containers:
        - name: paypilot-ui
          image: paypilot/paypilot-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: paypilot-ui
  namespace: paypilot
spec:
  type: NodePort
  selector: { app: paypilot-ui }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000