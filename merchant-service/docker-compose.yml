version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: merchant-postgres
    environment:
      POSTGRES_DB: merchant_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  merchant-service:
    build: .
    ports:
      - "8081:8081"
    depends_on:
      - postgres